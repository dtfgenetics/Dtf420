<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Seed Ascent | DTF Games</title>
<link rel="stylesheet" href="/seed-ascent/styles.css" />
</head>
<body>
<main class="shell">
  <div class="hud">
    <div class="brand">🌱 SEED ASCENT: SPROUT RUN</div>
    <div class="stats">
      <span>WORLD <b id="levelLabel">1-1</b></span><span>SCORE <b id="scoreLabel">000000</b></span>
      <span>✨ <b class="gold" id="trichomeLabel">0</b></span><span>❤️ <b id="healthLabel">3</b></span><span>⚡ <b id="powerLabel">NONE</b></span>
    </div>
  </div>
  <div class="stage"><canvas id="game" width="960" height="540" tabindex="0" aria-label="Seed Ascent retro side-scrolling platform game"></canvas></div>
  <div class="bar"><button class="primary" id="startBtn">▶ START</button><button class="desktopMove" id="prevBtn">◀ WORLD</button><button class="desktopMove" id="nextBtn">WORLD ▶</button><button id="pauseBtn">Ⅱ PAUSE</button><button id="restartBtn">↻ RESTART</button></div>
  <div class="mobile" aria-label="Touch controls"><button id="leftBtn" aria-label="Move left">◀</button><button id="rightBtn" aria-label="Move right">▶</button><button class="jump" id="jumpBtn">⬆ JUMP</button><button class="run" id="runBtn">⚡ RUN</button></div>
  <div class="hint">Move: ← → / A D · Jump: Space / W / ↑ · Hold jump for height · Shift = run · Double jump · P = pause</div>
</main>
<script src="/seed-ascent/levels.js"></script>
<script src="/seed-ascent/engine.js"></script>
</body>
</html>
