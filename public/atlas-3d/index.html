<!doctype html>
<html lang="en" data-atlas-model-state="loading">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07100c" />
  <title>THC Living Plant Atlas 3D Runtime</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body, #atlas-root {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 38%, rgba(61, 99, 63, .18), transparent 42%),
        linear-gradient(160deg, #06100b, #09150f 52%, #07100c);
    }
    body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #runtime-status {
      position: absolute;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -50%);
      padding: .62rem .86rem;
      border: 1px solid rgba(184, 207, 128, .18);
      border-radius: 999px;
      background: rgba(5, 12, 8, .72);
      color: rgba(232, 239, 212, .7);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .055em;
      backdrop-filter: blur(14px);
      box-shadow: 0 12px 34px rgba(0, 0, 0, .2);
      pointer-events: none;
    }
    #runtime-status[hidden] { display: none; }
    #runtime-legend {
      position: absolute;
      left: 14px;
      bottom: 14px;
      max-width: min(335px, calc(100% - 28px));
      padding: .52rem .68rem;
      border: 1px solid rgba(184, 207, 128, .12);
      border-radius: 10px;
      background: linear-gradient(90deg, rgba(5, 12, 8, .68), rgba(5, 12, 8, .48));
      color: rgba(231, 237, 212, .54);
      font-size: 10px;
      line-height: 1.42;
      backdrop-filter: blur(14px);
      box-shadow: 0 10px 26px rgba(0, 0, 0, .13);
      pointer-events: none;
    }
    #runtime-legend::before {
      content: "LIVE 3D";
      display: inline-block;
      margin-right: .48rem;
      color: rgba(169, 213, 99, .72);
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .12em;
    }
    @media (max-width: 620px) {
      #runtime-legend {
        left: 10px;
        bottom: 62px;
        max-width: 205px;
        padding: .42rem .52rem;
        font-size: 9px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      #runtime-status, #runtime-legend { backdrop-filter: none; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main id="atlas-root" aria-label="Interactive 3D cannabis plant anatomy model"></main>
  <div id="runtime-status" role="status">Initializing 3D anatomy…</div>
  <div id="runtime-legend" aria-live="polite">Overview · drag to orbit · pinch or wheel to zoom · tap a plant structure to inspect it.</div>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { startProductionAtlasRuntime } from "./atlas-production-model.js";
    import { startAtlasRuntime } from "./atlas-runtime.js";

    const parentOrigin = window.location.origin;

    function announceReady(modelState) {
      window.parent.postMessage({ type: "atlas:ready", renderer: "three", version: "0.185.1", modelState }, parentOrigin);
    }

    async function boot() {
      let productionStarted = false;
      try {
        productionStarted = await startProductionAtlasRuntime(THREE, OrbitControls, GLTFLoader);
      } catch (error) {
        document.documentElement.dataset.atlasModelState = "procedural";
        window.parent.postMessage({
          type: "atlas:model-state",
          state: "procedural",
          reason: "production-runtime-exception",
          message: error instanceof Error ? error.message : String(error),
        }, parentOrigin);
      }

      if (!productionStarted) {
        document.documentElement.dataset.atlasModelState = "procedural";
        startAtlasRuntime(THREE, OrbitControls);
      }

      const modelState = document.documentElement.dataset.atlasModelState || (productionStarted ? "production" : "procedural");
      announceReady(modelState);
      [150, 450, 900, 1600, 2600, 4000].forEach((delay) => window.setTimeout(() => announceReady(modelState), delay));
    }

    boot().catch((error) => {
      const status = document.getElementById("runtime-status");
      status.hidden = false;
      status.textContent = "3D runtime unavailable. The accessible Atlas fallback remains active.";
      window.parent.postMessage({ type: "atlas:runtime-error", message: error instanceof Error ? error.message : String(error) }, parentOrigin);
    });
  </script>
</body>
</html>
