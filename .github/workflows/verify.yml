name: Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "bootstrap/**"
      - "fix/**"
      - "feature/**"
      - "dependabot/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify lint, types, and production build
        run: npm run verify
        env:
          CI: "true"
