name: Migrate Stale Education Routes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-stale-education-routes.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Add one-time stale education route migration'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Migrate obsolete related-learning routes
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'content/education-related-links.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));

          const sensorSource = '/learn/cultivation-science/greenhouse-sensor-placement-and-data-quality';
          const sensorLinks = data[sensorSource];
          if (!Array.isArray(sensorLinks)) throw new Error('Greenhouse sensor source not found');
          const sensorTarget = sensorLinks.find((link) => link.href === '/learn/cultivation-science/sensor-placement-and-representative-sampling');
          if (!sensorTarget) throw new Error('Stale sensor-placement target not found');
          sensorTarget.kind = 'Atlas system';
          sensorTarget.title = 'Environment Overlay';
          sensorTarget.href = '/learn/atlas/environment-overlay';

          const lightSource = '/learn/cultivation-science/supplemental-lighting-and-dli-in-greenhouses';
          const lightLinks = data[lightSource];
          if (!Array.isArray(lightLinks)) throw new Error('Supplemental lighting source not found');
          const lightTarget = lightLinks.find((link) => link.href === '/learn/cultivation-science/ppfd-dli-and-light-measurement');
          if (!lightTarget) throw new Error('Stale PPFD target not found');
          lightTarget.kind = 'Cultivation science';
          lightTarget.title = 'Photoperiod Integrity, Blackout & Light Leaks';
          lightTarget.href = '/learn/cultivation-science/photoperiod-integrity-and-light-leaks';

          const oldPhSource = '/learn/cultivation-science/ph-and-ec-measurement-quality';
          const newPhSource = '/learn/cultivation-science/ph-alkalinity-and-root-zone-buffering';
          if (!Array.isArray(data[oldPhSource])) throw new Error('Stale pH/EC source not found');
          if (data[newPhSource]) throw new Error('New pH/alkalinity source already exists');
          data[newPhSource] = data[oldPhSource].map((link) =>
            link.href === '/learn/cultivation-science/measurement-uncertainty'
              ? {
                  kind: 'Cultivation science',
                  title: 'EC, Salinity & Osmotic Stress',
                  href: '/learn/cultivation-science/ec-salinity-and-osmotic-stress',
                }
              : link,
          );
          delete data[oldPhSource];

          const oldPpfdSource = '/learn/cultivation-science/ppfd-dli-and-light-measurement';
          if (!data[oldPpfdSource]) throw new Error('Stale PPFD source not found');
          delete data[oldPpfdSource];

          fs.writeFileSync(file, `${JSON.stringify(data, null, 2)}\n`);
          console.log('Migrated stale education route references.');
          NODE

      - name: Commit migrated link map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/education-related-links.json
          git commit -m "Migrate stale education related routes"
          git push origin HEAD:main
