name: Static Overlay QA

on:
  pull_request:
    paths:
      - app/**
      - components/**
      - data/**
      - lib/**
      - public/**
      - deployment/static-overlay.json
      - scripts/verify-static-overlay.mjs
      - next.config.ts
      - package.json
      - package-lock.json
      - .github/workflows/static-overlay-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build DTFSeeds static overlay
        run: npm run build:static-overlay

      - name: Verify child-route ownership and export
        run: npm run verify:static-overlay

      - name: Upload validated static export
        uses: actions/upload-artifact@v7
        with:
          name: dtfseeds-static-overlay-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 7
