name: Prepare learning API runtime dependency

on:
  push:
    branches:
      - deps/learning-api-runtime-2026-09-27
    paths:
      - .github/workflows/prepare-learning-api-runtime.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: deps/learning-api-runtime-2026-09-27

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install pinned API runtime dependency
        run: npm install --save-exact tsx@4.23.15

      - name: Remove one-shot workflow
        run: git rm .github/workflows/prepare-learning-api-runtime.yml

      - name: Commit generated dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Add pinned learning API runtime dependency"
          git push origin HEAD:deps/learning-api-runtime-2026-09-27
