name: Prepare learning runtime dependencies

on:
  push:
    branches:
      - deps/learning-runtime-2026-09-27
    paths:
      - .github/workflows/prepare-learning-runtime-deps.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: deps/learning-runtime-2026-09-27

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install pinned learning runtime dependencies
        run: |
          npm install --save-exact             better-auth@1.7.6             drizzle-orm@0.45.3             mysql2@3.24.4             zod@4.6.5

      - name: Remove one-shot workflow
        run: git rm .github/workflows/prepare-learning-runtime-deps.yml

      - name: Commit generated dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Add pinned learning runtime dependencies"
          git push origin HEAD:deps/learning-runtime-2026-09-27
